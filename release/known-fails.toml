# fontspector checks (Google Fonts profile) that fail on the release fonts for reasons outside
# this release. Each entry lists the failure codes it covers, optionally the files (glob
# patterns) it covers, and the reason; tools/check_release.py fails on anything else.

["googlefonts/glyph_coverage"]
codes = ["missing-codepoints"]
reason = "Gari covers Kannada only; the Google Fonts glyph sets require Latin."

["googlefonts/glyphsets/shape_languages"]
codes = ["no-glyphset-supported"]
reason = "Follows from glyph_coverage: no Google Fonts glyph set is 80% covered."

["googlefonts/render_own_name"]
codes = ["render-own-name"]
reason = "The family name is in Latin letters, which Gari does not have."

["opentype/code_pages"]
codes = ["no-code-pages"]
reason = "No Windows code page covers Kannada, so none is set."

["googlefonts/repo/dirname_matches_nameid_1"]
codes = ["mismatch"]
reason = "Checks the google/fonts repository layout, which this repository does not use."

["googlefonts/font_copyright"]
codes = ["bad-notice-format"]
reason = "Google Fonts wants 'Copyright YEAR The Familyname Project Authors (url)'. Gari credits 3 holders, the upstream ones under their own names."

[contour_count]
codes = ["no-contour"]
reason = "period and t are empty, unencoded and unused glyphs inherited from Navilu; removing them would renumber every glyph in the source."

["opentype/hmtx_cff_num_glyphs"]
codes = ["mismatch-number-of-glyphs-hmtx-cff"]
files = ["*.otf"]
reason = "The OTF stores trailing equal advance widths once, as the OpenType hmtx format allows; fontspector compares that count with the glyph count."

[shaperglot]
missing = ["U+0CBC", "U+0CBD"]
reason = "KANNADA SIGN NUKTA and KANNADA SIGN AVAGRAHA are not drawn in Gari yet; they need designed glyphs."
