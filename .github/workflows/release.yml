name: Release build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontforge
      - run: uv sync --locked --group release
      - name: Build and package
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) uv run python tools/release.py
      - name: Install fontspector 1.9.1
        run: |
          curl -sSfLo fontspector.tar.gz https://github.com/fonttools/fontspector/releases/download/fontspector-v1.9.1/fontspector-1.9.1-x86_64-unknown-linux-gnu.tar.gz
          echo "ff982bfbfb9edb60cb35512964fba2cc6560e94b492cf503f5dc9739c817a6b5  fontspector.tar.gz" | sha256sum -c -
          mkdir fontspector && tar -xzf fontspector.tar.gz -C fontspector --strip-components 1
      - name: Check the release font
        run: uv run python tools/check_release.py --fontspector fontspector/fontspector
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-gari
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/checks/
          if-no-files-found: error
