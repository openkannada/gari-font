[project]
name = "gari-tests"
version = "0"
description = "Shaping tests for the Gari font"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = ["fonttools==4.68.0", "uharfbuzz==0.57.0"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "skia-pathops==0.9.2",
]
release = [
    "brotli==1.2.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["check_release", "finish", "kannada", "mark_offsets", "release", "sfd_splice", "specimen"]
