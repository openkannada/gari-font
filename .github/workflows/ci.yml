name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --group release
      - name: Test the committed font
        run: uv run pytest -q
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontforge
      - name: Build the font from the source
        run: rm -f Gari.ttf && uv run make && test -s Gari.ttf
      - run: uv run ruff check tests tools/add_knd2.py tools/finish.py tools/release.py tools/check_release.py tools/specimen.py tools/shaperglot_gate.py tools/add_signs.py
      - run: uv run ruff format --check tests tools/add_knd2.py tools/finish.py tools/release.py tools/check_release.py tools/specimen.py tools/shaperglot_gate.py tools/add_signs.py
      - name: Test the font built from the source
        run: uv run pytest -q

  font-health:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: openkannada/font-health-action@v1
        with:
          fonts: Gari.ttf
          baseline: font-health/baseline.json
